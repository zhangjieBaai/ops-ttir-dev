exclude: ^(mean/(tutorial\.py|frozen_(extension|heuristics)\.py|upstream/|setup_attempts/)|sum/frozen_extension\.py$|logsumexp/frozen_(extension|heuristics)\.py$|layer_norm/backward_dx/tutorial\.py$|(layer_norm|mm|vector_add|logsumexp|sum)/tutorial\.py$|(mm|vector_add|logsumexp|sum)/upstream/|(int4_gemm|moe_routing|attention_dkdv)/(tutorial\.py$|frozen[^/]*\.py$|upstream/)|(norm_quant|partial_topk)/frozen_baseline\.py$|(norm_quant|partial_topk)/source_port/source_v1\.py$|int4_gemm/source_port/source_v1\.py$|moe_routing/source_port/membership_source_v1\.py$|attention_dkdv/source_port/frozen_port\.py$)
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: python -m black
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: python -m isort --profile black
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: python -m flake8 --max-line-length=120
        language: system
        types: [python]
