exclude: ^(mean/(tutorial\.py|frozen_(extension|heuristics)\.py|upstream/|setup_attempts/)|sum/frozen_extension\.py$|logsumexp/frozen_(extension|heuristics)\.py$|layer_norm/backward_dx/tutorial\.py$|(layer_norm|mm|vector_add|logsumexp|sum)/tutorial\.py$|(mm|vector_add|logsumexp|sum)/upstream/)
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: python -m black
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: python -m isort --profile black
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: python -m flake8 --max-line-length=120
        language: system
        types: [python]
